name: Editor foundations migration

on:
  push:
    branches:
      - architecture/editor-foundations

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - name: Apply focused migration
        run: |
          node scripts/apply-editor-foundations.mjs
          node scripts/patch-editor-foundation-tests.mjs
      - name: Resolve dependencies and lockfile
        run: bun install
      - name: Verify architecture slice
        run: bun run check
      - name: Persist generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add features/editor/Editor.tsx features/editor/Editor.integration.test.tsx bun.lock
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "refactor: wire editor foundations into Flat Stories"
            git push
          fi
