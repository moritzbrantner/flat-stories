name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - name: Set up repository environment
        run: bash scripts/codex-environment.sh setup
      - name: Verify canonical gate
        run: bun run check

  platform-packages-workbench-candidate:
    runs-on: ubuntu-latest
    env:
      PLATFORM_PACKAGES_SHA: c2da2da3606fe277263cb9b33a195e9b5a8ea851
      GH_PACKAGES_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact platform-packages candidate
        uses: actions/checkout@v6
        with:
          repository: moritzbrantner/platform-packages
          ref: c2da2da3606fe277263cb9b33a195e9b5a8ea851
          path: candidate-platform-packages
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - name: Verify immutable candidate head
        run: test "$(git -C candidate-platform-packages rev-parse HEAD)" = "$PLATFORM_PACKAGES_SHA"
      - name: Install flat-design candidate dependencies
        working-directory: candidate-platform-packages
        run: bun install --frozen-lockfile --filter @moritzbrantner/flat-design
      - name: Supply public validation tooling
        run: |
          mkdir -p /tmp/flat-design-validation
          cat > /tmp/flat-design-validation/package.json <<'EOF'
          {
            "private": true,
            "dependencies": {
              "@testing-library/react": "16.3.0",
              "jsdom": "26.1.0",
              "tsup": "8.5.0",
              "vitest": "4.1.2"
            }
          }
          EOF
          cd /tmp/flat-design-validation
          bun install
          target="$GITHUB_WORKSPACE/candidate-platform-packages/node_modules"
          rm -rf node_modules/react node_modules/react-dom
          ln -s "$target/react" node_modules/react
          ln -s "$target/react-dom" node_modules/react-dom
          mkdir -p "$target/.bin" "$target/@testing-library"
          ln -s /tmp/flat-design-validation/node_modules/vitest "$target/vitest"
          ln -s /tmp/flat-design-validation/node_modules/jsdom "$target/jsdom"
          ln -s /tmp/flat-design-validation/node_modules/tsup "$target/tsup"
          ln -s /tmp/flat-design-validation/node_modules/@testing-library/react "$target/@testing-library/react"
          ln -s /tmp/flat-design-validation/node_modules/.bin/vitest "$target/.bin/vitest"
          ln -s /tmp/flat-design-validation/node_modules/.bin/tsup "$target/.bin/tsup"
      - name: Type-check flat-design workbench
        working-directory: candidate-platform-packages/packages/flat-design
        run: bun run check-types
      - name: Test flat-design workbench
        working-directory: candidate-platform-packages/packages/flat-design
        run: bun run test
      - name: Build flat-design package
        working-directory: candidate-platform-packages/packages/flat-design
        run: bun run build
