name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: Set up Rust renderer toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --target wasm32-unknown-unknown
      - name: Set up repository environment
        run: bash scripts/codex-environment.sh setup
      - name: Verify canonical gate
        run: bun run check
