name: repair-bootstrap

on:
  push:
    branches:
      - repair/environment-and-ci

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - name: Resolve intended dependency graph
        run: bun install
      - name: Verify canonical gate
        run: bun run check
      - name: Capture generated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bun-lock
          path: bun.lock
          if-no-files-found: error
