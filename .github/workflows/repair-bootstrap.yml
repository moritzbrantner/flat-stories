name: repair-bootstrap

on:
  push:
    branches:
      - repair/environment-and-ci

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/environment-and-ci
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - name: Resolve intended dependency graph
        run: bun install
      - name: Verify canonical gate
        run: bun run check
      - name: Commit tested lockfile
        run: |
          if git diff --quiet -- bun.lock && git ls-files --error-unmatch bun.lock >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: commit Bun lockfile"
          git push origin HEAD:repair/environment-and-ci
